[project]
name = "dr"
version = "0.1.0"
description = "Reproducible deep-RL experiments on a synthetic demand-response task"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "numpy", "pyyaml", "matplotlib", "mlflow"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
